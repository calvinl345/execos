name: Checks

# Type check, lint, the fast test suite, and the dashboard type check.
# None of these need a database; the database and migration suites run
# against a local Supabase stack (see package.json `test:db:local`).
# Runs on every push and pull request.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Fast tests
        run: npm test
      - name: Dashboard type check
        run: npm run check:web
